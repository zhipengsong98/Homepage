<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }}</title>
    
    <style>
        /* 1. 基础字号与整体布局 */
        html, body {
            font-size: 21px; /* 电脑端大字号 */
            line-height: 1.8;
            color: #333;
            background-color: #fff;
            font-family: "Georgia", "Times New Roman", "Source Han Serif SC", serif;
        }

        body {
            max-width: 850px; /* 限制宽度，方便阅读 */
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* 2. 移动端自适应 */
        @media (max-width: 768px) {
            html, body {
                font-size: 18px; /* 手机端稍微缩小一点，更协调 */
            }
            body {
                padding: 20px 15px;
            }
        }

        /* 3. 增强链接和标题的可读性（可选） */
        a { color: #007bff; text-decoration: none; }
        a:hover { text-decoration: underline; }
        h1, h2, h3 { line-height: 1.3; margin-top: 1.5em; }
    </style>
</head>

<body>
    {{ content }}
</body>
</html>
