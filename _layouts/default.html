<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }}</title>
    
    <style>
        /* 1. 基础字号与整体布局 */
        html, body {
            font-size: 20px; /* 电脑端大字号 */
            line-height: 1.8;
            color: #333;
            background-color: #fff;
            font-family: "Georgia", "Times New Roman", "Source Han Serif SC", serif;
        }

        body {
            max-width: 850px; /* 限制宽度，方便阅读 */
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* 2. 移动端自适应 */
        @media (max-width: 768px) {
            html, body {
                font-size: 17px; /* 手机端稍微缩小一点，更协调 */
            }
            body {
                padding: 20px 15px;
            }
        }

        /* 3. 增强链接和标题的可读性（可选） */
        a { color: #007bff; text-decoration: none; }
        a:hover { text-decoration: underline; }
        h1, h2, h3 { line-height: 1.3; margin-top: 1.5em; }

        /* 针对学术主页的细节微调 */
h2 {
    border-bottom: 2px solid #eee; /* 给标题加条横线，更有结构感 */
    padding-bottom: 10px;
    margin-top: 40px;
    color: #2c3e50;
}

ul {
    padding-left: 25px;
}

li {
    margin-bottom: 12px; /* 列表项之间留点空隙，大字号下不显拥挤 */
}

strong {
    color: #000; /* 让你的名字和合作者名字更突出 */
}

/* 让年份对齐更美观 */
li b, li strong {
    display: inline-block;
    min-width: 100px; /* 如果你想让日期部分稍微对齐 */
}
    </style>
</head>

<body>
    <h1>{{ page.title }}</h1> 
    
    {{ content }}
</body>
</html>
