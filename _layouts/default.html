<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }}</title>
    <link rel="icon" type="image/png" href="./favicon.png">
    <style>
        html, body {
            font-size: 21px;
            line-height: 1.8;
            color: #333;
            background-color: #fff;
            font-family: "Georgia", "Times New Roman", serif;
        }

        body {
            max-width: 850px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        @media (max-width: 768px) {
            html, body { font-size: 18px; }
            body { padding: 20px 15px; }
        }

        a { color: #007bff; text-decoration: none; }
        a:hover { text-decoration: underline; }
        
        h1 {
            font-size: 2.2rem;
            color: #2c3e50;
            margin-bottom: 0.5rem;
            border-bottom: 3px solid #007bff;
            display: inline-block;
        }

        h2 {
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            margin-top: 40px;
            color: #2c3e50;
        }

        ul { padding-left: 25px; }
        li { margin-bottom: 12px; }
        strong { color: #000; }

        li b, li strong:first-child {
            display: inline-block;
            min-width: 150px;
        }

        .language-switcher {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 16px;
        }

        .language-switcher button {
            border: 1px solid #007bff;
            border-radius: 4px;
            background: #fff;
            color: #007bff;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85rem;
            padding: 6px 12px;
        }

        .language-switcher button:hover {
            background: #f0f7ff;
        }

    </style>
</head>
<body>
    <div class="language-switcher">
        <button id="language-toggle" type="button">中文</button>
    </div>
    <header>
        <h1><span data-en="Zhipeng Song" data-zh="宋智鹏">{{ page.title }}</span></h1>
    </header>
    
    <main>
        {{ content }}
    </main>
    <script>
        (function () {
            const toggle = document.getElementById('language-toggle');
            const translatable = document.querySelectorAll('[data-en][data-zh]');
            const savedLanguage = localStorage.getItem('language') || 'en';

            function setLanguage(language) {
                document.documentElement.lang = language === 'zh' ? 'zh-CN' : 'en';
                translatable.forEach(function (element) {
                    element.textContent = element.dataset[language];
                });
                document.title = language === 'zh' ? '宋智鹏' : 'Zhipeng Song';
                toggle.textContent = language === 'zh' ? 'English' : '中文';
                localStorage.setItem('language', language);
            }

            toggle.addEventListener('click', function () {
                const nextLanguage = document.documentElement.lang === 'zh-CN' ? 'en' : 'zh';
                setLanguage(nextLanguage);
            });

            setLanguage(savedLanguage);
        })();
    </script>
</body>
</html>
